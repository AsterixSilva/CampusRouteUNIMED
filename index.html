  <style id="campusroute-early-clean">
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071018; }
    #scope-mask, #title-bar, #style-indicator, #top-center-actions,
    #global-loading-status, #traffic-sync-chip, #cctv-sync-chip,
    #safe-frame-overlay, #intel-hud, #left-panel-stack, #right-context-rail,
    #command-dock, #key-setup-chip, #key-setup, #first-run-launcher,
    #toast, #pp-toggles { display: none !important; }
    #loading-screen { position: fixed !important; inset: 0 !important; z-index: 2500 !important; display: flex !important; align-items: center !important; justify-content: center !important; background: #071018 !important; }
    #loading-screen .loader-content { width: min(320px, calc(100vw - 40px)) !important; text-align: center !important; }
    #loading-screen .campusroute-loader-mark { width: 104px !important; height: 104px !important; max-width: 104px !important; max-height: 104px !important; object-fit: contain !important; display: block !important; margin: 0 auto 16px !important; }
    #cesiumContainer { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; }
  </style>

       with the sources: src/materialSymbolsSubset.test.mjs fails when a source

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,flare,flight,layers_clear,light_mode,local_fire_department,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,skip_next,skip_previous,view_in_ar" rel="stylesheet" />
